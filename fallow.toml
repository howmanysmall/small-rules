entry = [
	"src/index.ts",
	"src/reset.d.ts",
	"*.config.ts",
	"scripts/*.ts",
	"tests/**/*.fuzz.ts",
	"tests/**/*.bench.ts",
	"documentation/src/components/overrides/*.astro",
	"documentation/src/route-data/*.ts",
	"documentation/src/styles/custom.css",
	"tools/vite-configuration/src/setup.ts"
]
ignorePatterns = ["tests/fixtures/**", "plugins/**", "src/generated/**", ".benchmarks/**", ".opencode/**", ".claude/**"]
ignoreDependencies = [
	"@arethetypeswrong/core",
	"@astrojs/markdown-satteri",
	"@e18e/eslint-plugin",
	"@fontsource-variable/ibm-plex-sans",
	"@fontsource-variable/newsreader",
	"@fontsource/ibm-plex-mono",
	"@isentinel/hooks",
	"@stylistic/eslint-plugin",
	"@total-typescript/ts-reset",
	"eslint-plugin-antfu",
	"eslint-plugin-better-max-params",
	"eslint-plugin-comment-length",
	"eslint-plugin-de-morgan",
	"eslint-plugin-eslint-plugin",
	"eslint-plugin-flawless",
	"eslint-plugin-jest-extended",
	"eslint-plugin-jsdoc",
	"eslint-plugin-n",
	"eslint-plugin-oxfmt",
	"eslint-plugin-perfectionist",
	"eslint-plugin-pnpm",
	"eslint-plugin-react-jsx",
	"eslint-plugin-react-naming-convention",
	"eslint-plugin-react-x",
	"eslint-plugin-roblox-ts",
	"eslint-plugin-sonarjs",
	"eslint-plugin-unicorn",
	"eslint-plugin-unused-imports",
	"oxc-transform-react",
	"sharp"
]
ignoreExportsUsedInFile = true
overrides = []

[[ignoreDependencyOverrides]]
package = "vite"
source = "pnpm-workspace.yaml"

[rules]
unused-files = "error"
unused-exports = "error"
unused-types = "error"
unused-dependencies = "error"
unused-dev-dependencies = "error"
unused-optional-dependencies = "error"
unused-enum-members = "error"
unlisted-dependencies = "error"
unresolved-imports = "error"
duplicate-exports = "error"
circular-dependencies = "error"
re-export-cycle = "error"
type-only-dependencies = "error"
test-only-dependencies = "error"
unused-dependency-overrides = "error"
stale-suppressions = "error"

[health]
maxCyclomatic = 20
maxCognitive = 15
maxCrap = 30
crapRefactorBand = 5
maxUnitSize = 60
coverage = ".cache/istanbul/coverage-final.json"
ignore = ["scripts/**", "*.config.ts"]
suggestInlineSuppression = true

[health.ownership]
botPatterns = ["*\\[bot\\]*", "dependabot*", "renovate*", "github-actions*", "svc-*", "*-service-account*"]
emailMode = "handle"

[duplicates]
mode = "mild"
minLines = 5
minTokens = 50
threshold = 0.5
ignoreDefaults = true
ignore = [
	"documentation/src/styles/custom.css",
	"src/rules/anti-slop/**",
	"tests/fixtures/**",
	"scripts/utilities/casing-utilities.ts"
]

[audit]
gate = "new-only"
