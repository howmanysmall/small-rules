[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]

HK_MISE = 1

[settings]
auto_install = false
experimental = true
lockfile = true
provenance_api_failures_fatal = false

[tools]
"cargo:similarity-ts" = "latest"
"github:howmanysmall/pullhook" = "latest"
"npm:sherif" = "latest"
actionlint = "latest"
betterleaks = "latest"
bun = "latest"
hk = "1.50.0"
ni = "latest"
node = "24"
nub = "latest"
pinact = "latest"
pkl = "latest"
pnpm = "11.17.0"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
vale = "latest"
zizmor = "latest"

[tasks]
[tasks.install]
description = "Install dependencies from the pnpm lockfile. Use before local CI or release checks."
run = "ni"

[tasks.lint]
description = "Run the project lint pipeline: Oxlint plus Biome checks via the package script."
run = "node --run lint"

[tasks.type-check]
description = "Run TypeScript type checking with tsgo without emitting files."
run = "node --run type-check"

[tasks.knip]
description = "Detect unused files, exports, and dependencies with Knip."
run = "node --run knip"

[tasks.duplicates]
alias = "dupes"
description = "Detect duplicated/structurally-similar code in src with similarity-ts (AST-based jscpd replacement)."
run = "similarity-ts --threshold 0.85 --min-lines 5 --print src"

[tasks.duplicates-ui]
alias = "dupes-ui"
description = "Run similarity-ts and open a readable duplicate report in the browser."
run = "similarity-ts --threshold 0.85 --min-lines 5 --print src | bun scripts/dupes-viewer.ts --open"

[tasks.build]
description = "Build the package into dist using tsdown."
run = "node --run build"

[tasks.test]
description = "Run the Vitest unit test suite once without sharding."
run = "node --run test"

[tasks.documentation]
description = "Run the documentation build plus unit and Chromium browser tests."
run = "pnpm --filter docs exec playwright install chromium && pnpm --filter docs run build && pnpm --filter docs run test:unit && pnpm --filter docs run test:browser"

[tasks.deploy-docs]
alias = "dd"
description = "Trigger the Deploy Documentation workflow. Rebuilds and deploys the docs site without a release."
run = "gh workflow run 'Deploy Documentation' --ref main"

[tasks.check]
description = "Run all local validation checks except dependency installation. Mirrors release validation before artifact checks."
depends = ["lint", "type-check", "knip", "build", "test"]

[tasks.ci]
description = "Run the full CI suite, including package and documentation validation."
depends = ["install", "check", "documentation"]

[tasks.release]
description = "Run local validation, then bump version, commit, tag, and push via bumpp. Run from an up-to-date main branch."
depends = ["check"]
interactive = true
confirm = "This will run bumpp, create a release commit/tag, and push. Continue?"
run = "node --run release"

[tasks.dry-release]
alias = "dr"
description = "Trigger the GitHub release workflow on main with dry_run=true. Validates release CI without publishing."
interactive = true
run = "gh workflow run release.yaml --ref main -f dry_run=true"

[tasks.release-status]
description = "Show recent Publish Package workflow runs in GitHub Actions."
run = "gh run list --workflow release.yaml --limit 5"
