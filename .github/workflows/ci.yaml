name: CI

on:
  push:
    branches:
      - main
    paths: &ci-paths
      - "**/*.markdown"
      - "**/*.md"
      - "**/*.mdx"
      - "**/turbo.json"
      - "*.config.ts"
      - ".github/actions/**"
      - .github/jactionlint.yaml
      - .github/workflows/bundle-size.yaml
      - .github/workflows/checks.yaml
      - .github/workflows/ci.yaml
      - .github/workflows/deep-tests.yaml
      - .github/workflows/docs.yaml
      - .github/workflows/release.yaml
      - ".ox*trc.json"
      - .vale.ini
      - biome.jsonc
      - codecov.yaml
      - "documentation/**"
      - hk.pkl
      - mise.lock
      - mise.toml
      - package.json
      - "patches/**"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "scripts/**"
      - "src/**/*.json"
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "tests/**"
      - "tsconfig*.json"
      - "turbo/**"
  pull_request:
    paths: *ci-paths

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    uses: $/.github/workflows/checks.yaml

  # Separate from `checks` so `id-token: write` never reaches a job that runs pull request code.
  coverage:
    name: Coverage
    permissions:
      contents: read
      id-token: write
    needs: checks
    # Fork pull requests cannot mint an OIDC token for Codecov, so skip them rather than go red.
    if: >-
      needs.checks.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Missing when `--affected` skipped every test.
      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
        continue-on-error: true

      - if: hashFiles('coverage/coverage-final.json') != ''
        name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          files: coverage/coverage-final.json
          flags: unit
          use_oidc: true
    timeout-minutes: 15

  vale:
    name: Vale
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup
        with:
          tools: vale

      # Styles live in gitignored `.vale/styles`; `Packages` in `.vale.ini` is the source.
      - name: Sync styles
        run: vale sync

      - name: Lint prose
        run: vale --no-color .
    timeout-minutes: 15

  workflow-security:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Workflow Security
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changes
        name: Check if .github/ changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if git diff --name-only "$BASE" "$HEAD" 2>/dev/null | grep -q '^\.github/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.changed == 'true'
        name: Setup toolchain
        uses: $/.github/actions/setup
        with:
          tools: jactionlint pinact

      - parallel:
          - if: steps.changes.outputs.changed == 'true'
            name: jactionlint
            run: jactionlint

          - if: steps.changes.outputs.changed == 'true'
            name: pinact
            run: pinact run
    timeout-minutes: 15
