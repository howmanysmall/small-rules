name: Checks

on:
  workflow_call:

permissions: {}

env:
  # `--affected` diffs against the same base as "Collect changed files". Left
  # to its default it compares with main, which on a push to main is itself.
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup

      - name: Install dependencies
        uses: $/.github/actions/install

      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-eslint-v1-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts') }}-${{ github.sha }}
          path: .eslintcache-*
          restore-keys: |
            ${{ runner.os }}-eslint-v1-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts') }}-

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          path: .turbo/cache
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Collect changed files
        run: git diff --name-only --diff-filter=ACMRT -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - parallel:
          - name: Biome
            run: |
              mapfile -d '' changed_files < "$RUNNER_TEMP/changed-files"
              if ((${#changed_files[@]} > 0)); then
                node --run biome -- ci --no-errors-on-unmatched "${changed_files[@]}"
              fi

          # isentinel-lint already runs oxfmt on everything else; .mdx is the only
          # format neither it nor Biome covers.
          - name: oxfmt (MDX)
            run: |
              mapfile -d '' changed_files < "$RUNNER_TEMP/changed-files"
              mdx_files=()
              for file in "${changed_files[@]}"; do
                [[ $file == *.mdx ]] && mdx_files+=("$file")
              done
              if ((${#mdx_files[@]} > 0)); then
                node --run oxfmt -- --no-error-on-unmatched-pattern --check "${mdx_files[@]}"
              fi

          - name: Lint
            run: |
              mapfile -d '' changed_files < "$RUNNER_TEMP/changed-files"
              if ((${#changed_files[@]} > 0)); then
                node --run isentinel-lint -- "${changed_files[@]}"
              fi

          - name: Type Check
            run: pnpm exec turbo run type-check --affected

          - name: Dead code
            run: node --run fallow:dead-code

          - name: Duplication
            run: node --run fallow:dupes

          # No `--affected`: the step checks `dist/`, which a skipped task never
          # writes, while a cache hit restores it.
          - name: Build
            run: pnpm exec turbo run build --filter=// -- --minify && test -f dist/index.js
    timeout-minutes: 15

  documentation:
    name: Documentation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup
        with:
          tools: bun node pnpm ni

      - name: Install dependencies
        uses: $/.github/actions/install

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          path: .turbo/cache
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Restore Chromium cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          path: ~/.cache/ms-playwright

      # Only the browser tests need Chromium, so install it while the Astro
      # steps run. They stay sequential because they share `.astro/` and `dist/`.
      # The Ubuntu image has the shared libraries; --with-deps only adds an
      # unbounded APT path for optional packages such as fonts.
      - id: install-chromium
        name: Install Chromium
        run: pnpm --filter @small-rules/documentation exec playwright install chromium
        timeout-minutes: 5
        background: true

      # turbo.json orders check, build, and test:unit, which share `.astro/`.
      - name: Check, build, and test documentation
        run: pnpm exec turbo run check build test:unit --filter=@small-rules/documentation --affected

      - name: Wait for Chromium
        wait: install-chromium

      - name: Test documentation in Chromium
        run: pnpm exec turbo run test:browser --filter=@small-rules/documentation --affected
    timeout-minutes: 15

  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup
        with:
          tools: bun node pnpm vale

      - name: Install dependencies
        uses: $/.github/actions/install

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          path: .turbo/cache
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - parallel:
          - name: Run tests
            run: pnpm exec turbo run test --affected -- --reporter github-actions --reporter dot

          - name: Run fuzz regressions
            run: node --run test:fuzz
    timeout-minutes: 15
