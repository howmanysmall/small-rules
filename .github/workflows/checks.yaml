name: Checks

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup

      - name: Install dependencies
        uses: $/.github/actions/install

      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-eslint-v1-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts') }}-${{ github.sha }}
          path: .eslintcache-*
          restore-keys: |
            ${{ runner.os }}-eslint-v1-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts') }}-

      - name: Collect changed files
        run: git diff --name-only --diff-filter=ACMRT -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - parallel:
          - name: Biome
            run: |
              mapfile -d '' changed_files < "$RUNNER_TEMP/changed-files"
              if ((${#changed_files[@]} > 0)); then
                node --run biome -- ci --no-errors-on-unmatched "${changed_files[@]}"
              fi

          # isentinel-lint already runs oxfmt on everything else; .mdx is the only
          # format neither it nor Biome covers.
          - name: oxfmt (MDX)
            run: |
              mapfile -d '' changed_files < "$RUNNER_TEMP/changed-files"
              mdx_files=()
              for file in "${changed_files[@]}"; do
                [[ $file == *.mdx ]] && mdx_files+=("$file")
              done
              if ((${#mdx_files[@]} > 0)); then
                node --run oxfmt -- --no-error-on-unmatched-pattern --check "${mdx_files[@]}"
              fi

          - name: Lint
            run: |
              mapfile -d '' changed_files < "$RUNNER_TEMP/changed-files"
              if ((${#changed_files[@]} > 0)); then
                node --run isentinel-lint -- "${changed_files[@]}"
              fi

          - name: Type Check
            run: node --run type-check

          - name: Dead code
            run: node --run fallow:dead-code

          - name: Duplication
            run: node --run fallow:dupes

          - name: Build
            run: node --run build -- --minify && test -f dist/index.js

  documentation:
    name: Documentation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup
        with:
          tools: bun node pnpm ni

      - name: Install dependencies
        uses: $/.github/actions/install

      - name: Restore Chromium cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          path: ~/.cache/ms-playwright

      # Only the browser tests need Chromium, so install it while the Astro
      # steps run. They stay sequential because they share `.astro/` and `dist/`.
      - id: install-chromium
        name: Install Chromium
        run: pnpm --filter @small-rules/documentation exec playwright install --with-deps chromium
        background: true

      - name: Type check documentation
        run: node --run check
        working-directory: documentation

      - name: Build documentation
        run: node --run build
        working-directory: documentation

      - name: Test React components
        run: node --run test:unit
        working-directory: documentation

      - name: Wait for Chromium
        wait: install-chromium

      - name: Test documentation in Chromium
        run: node --run test:browser
        working-directory: documentation

  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup

      - name: Install dependencies
        uses: $/.github/actions/install

      - parallel:
          - name: Run tests
            run: node --run test -- --reporter github-actions --reporter dot

          - name: Run fuzz regressions
            run: node --run test:fuzz
