name: Checks

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Collect changed files
        run: git diff --name-only --diff-filter=ACMRT -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Biome
        run: |
          mapfile -d '' changed_files < "$RUNNER_TEMP/changed-files"
          if ((${#changed_files[@]} > 0)); then
            node --run biome -- ci --no-errors-on-unmatched "${changed_files[@]}"
          fi

      - name: oxfmt
        run: |
          mapfile -d '' changed_files < "$RUNNER_TEMP/changed-files"
          if ((${#changed_files[@]} > 0)); then
            node --run oxfmt -- --no-error-on-unmatched-pattern --check "${changed_files[@]}"
          fi

      - name: Lint
        run: |
          mapfile -d '' changed_files < "$RUNNER_TEMP/changed-files"
          if ((${#changed_files[@]} > 0)); then
            node --run isentinel-lint -- "${changed_files[@]}"
          fi

      - name: Type Check
        run: node --run type-check

      - name: Knip
        run: node --run knip

      - name: Build
        run: node --run build -- --minify && test -f dist/index.js

  documentation:
    name: Documentation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          tools: bun node pnpm ni

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Type check documentation
        run: node --run check
        working-directory: documentation

      - name: Install Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Build documentation
        run: node --run build
        working-directory: documentation

      - name: Test React components
        run: node --run test:unit
        working-directory: documentation

      - name: Test documentation in Chromium
        run: node --run test:browser
        working-directory: documentation

  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Run tests
        run: node --run test -- --reporter github-actions --reporter dot
