StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Google, Microsoft, RedHat, ai-tells, alex, proselint, write-good, Readability

[*.{md,mdx}]
BasedOnStyles = Vale, Google, ai-tells, alex, proselint, Readability
Vale.Spelling = NO

Microsoft.Adverbs = YES
Microsoft.Wordiness = YES
Microsoft.ComplexWords = YES

write-good.Weasel = YES
write-good.TooWordy = YES

[*.tsx]
BasedOnStyles = Vale, ai-tells, proselint
Vale.Spelling = NO

[*.mdx]
TokenIgnores = '(?:(?<!\{)(\{#[^\n}]+\})(?!`))|(?:`[^`\n]*`)'
Google.Semicolons = NO

[README.md]
Google.FirstPerson = NO
Google.We = NO
write-good.Weasel = NO

[{AGENTS,CHANGELOG,CODING_STANDARDS,GLOSSARY,THIRD-PARTY-NOTICES}.md]
BasedOnStyles = Vale
