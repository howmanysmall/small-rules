minimumReleaseAgeStrict: true
resolutionMode: time-based
shellEmulator: true
strictDepBuilds: true
strictPeerDependencies: false
trustPolicy: no-downgrade

trustPolicyExclude:
  - skills

trustPolicyIgnoreAfter: 10080

# Equivalent to pnpm-workspace.yaml `packages:`
packages:
  - .omp
  - .opencode
  - documentation
  - scripts

# Force specific versions of any dependency (including transitive)
overrides:
  "@isentinel/eslint-config>@pobammer-ts/small-rules": "link:./plugins"
  vite: ^8

