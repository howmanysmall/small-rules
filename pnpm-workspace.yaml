allowBuilds:
  "@openrouter/sdk": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

packageExtensions:
  "@stryker-mutator/core@10.1.1":
    dependencies:
      "@stryker-mutator/vitest-runner": 10.1.1
      typescript: 5.9.3
  astro@7.4.0:
    peerDependencies:
      "@astrojs/check": "*"
      typescript: "*"
    peerDependenciesMeta:
      "@astrojs/check":
        optional: true
      typescript:
        optional: true
  # The patched getExePath falls back to TypeScript's own compiler on Windows
  # when the @tsrs platform binary is missing.
  tsrs@0.20.1-ts7.1.0-beta:
    optionalDependencies:
      "@typescript/typescript-win32-arm64": 7.1.0-beta
      "@typescript/typescript-win32-x64": 7.1.0-beta

peerDependencyRules:
  allowedVersions:
    "@emnapi/core": ">=1.0.0"
    "@emnapi/runtime": ">=1.0.0"
    "@typescript-eslint/*>typescript": ">=6.0.0 <7.0.0"

fetchRetries: 5
fetchRetryMaxtimeout: 30000
fetchRetryMintimeout: 1000
fetchTimeout: 60000

permissions:
  arktype:
    skills: true
  fallow:
    skills: true

registries:
  "@jsr": https://npm.jsr.io

strictSsl: true
strictStorePkgContentCheck: true
verifyStoreIntegrity: true
