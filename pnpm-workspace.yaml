# Only allow specific packages to run install scripts
allowBuilds:
  "@openrouter/sdk": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

packageExtensions:
  "@astrojs/mdx@7.0.0":
    dependencies:
      "@astrojs/starlight": 0.41.1
      satteri: 0.9.2
  "@stryker-mutator/core@9.6.1":
    dependencies:
      "@stryker-mutator/vitest-runner": 9.6.1
      typescript: 5.9.3
  astro@7.0.3:
    peerDependencies:
      "@astrojs/check": "*"
      typescript: "*"
    peerDependenciesMeta:
      "@astrojs/check":
        optional: true
      typescript:
        optional: true

peerDependencyRules:
  allowedVersions:
    "@emnapi/core": ">=1.0.0"
    "@emnapi/runtime": ">=1.0.0"
    "@typescript-eslint/*>typescript": ">=6.0.0 <7.0.0"

fetchRetries: 5
fetchRetryMaxtimeout: 30000
fetchRetryMintimeout: 1000
fetchTimeout: 60000
strictSsl: true
strictStorePkgContentCheck: true
verifyStoreIntegrity: true

