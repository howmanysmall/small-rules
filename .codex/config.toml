features.hooks = true
model_context_window = 372000

[mcp_servers.astro-docs]
url = "https://mcp.docs.astro.build/mcp"

[mcp_servers.chrome-devtools]
args = ["./scripts/get-chrome-path.sh", "--serve"]
command = "bash"

[mcp_servers.context7]
env_http_headers = { CONTEXT7_API_KEY = "CONTEXT7_API_KEY" }
url = "https://mcp.context7.com/mcp"

[mcp_servers.hk]
args = ["mcp", "--root", "."]
command = "hk"

[features.multi_agent_v2]
max_concurrent_threads_per_session = 1000

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "bun .codex/hooks/fallow-gate.ts"
timeout = 600

[[hooks.PostToolUse]]
matcher = "apply_patch"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "bash scripts/quiet-on-success.sh bash -c 'set -euo pipefail; bash scripts/format-lint-relevant.sh; bash scripts/test-relevant.sh'"
timeout = 600

[[hooks.PostToolUse]]
matcher = "apply_patch"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "bun run .codex/hooks/react-doctor.ts"
timeout = 600
statusMessage = "Running React Doctor"
